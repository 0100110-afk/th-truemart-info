<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B4C8C">
  <title>TH true mart · Quản lý hệ thống</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-96.png">
  <script>
    /* Chọn giao diện: ?ui=mobile / ?ui=desktop để ép, còn lại tự theo màn hình
       (giống doGet cũ: ?ui=mobile -> IndexMobile). Giữ nguyên phần còn lại của URL. */
    (function () {
      var p = new URLSearchParams(location.search);
      var ui = p.get('ui');
      if (!ui) ui = window.matchMedia('(max-width: 820px)').matches ? 'mobile' : 'desktop';
      p.delete('ui');
      var q = p.toString();
      location.replace((ui === 'mobile' ? 'mobile.html' : 'desktop.html') + (q ? '?' + q : '') + location.hash);
    })();
  </script>
</head>
<body style="background:#0B4C8C;"></body>
</html>
