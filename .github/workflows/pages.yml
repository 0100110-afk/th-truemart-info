# Tự đưa web lên GitHub Pages mỗi lần push vào nhánh main.
# Chỉ xuất bản phần chạy trên trình duyệt — mã Apps Script, công cụ build và test KHÔNG bị lộ ra web.
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gom file web
        run: |
          mkdir _site
          cp -r index.html desktop.html mobile.html manifest.webmanifest sw.js .nojekyll css js icons _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
